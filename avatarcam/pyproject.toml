[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avatarcam"
version = "0.1.0"
description = "Real-time face and body persona for webcam, calls, and streaming (ONNX Runtime, Windows on ARM friendly)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0,<3",
    "pillow>=10",
    "onnxruntime>=1.20",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# OpenCV is a hard runtime requirement but has no official Windows ARM64 wheel;
# requirements-arm64.txt pins the experimental wheel. Everywhere else, pip can resolve it.
opencv = ["opencv-python-headless>=4.10"]
qnn = ["onnxruntime-qnn>=2.4"]
virtualcam = ["pyvirtualcam>=0.11"]
dev = ["pytest>=8", "onnx>=1.16"]

[project.scripts]
avatarcam = "avatarcam.app:main"
avatarcam-bench = "avatarcam.bench:main"
avatarcam-prepare = "avatarcam.tools.prepare_avatar:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["avatarcam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
