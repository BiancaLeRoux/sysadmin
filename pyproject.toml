[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fxpaper"
version = "0.1.0"
description = "An FX paper trading simulator with a CLI and a reusable library"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
fxpaper = "fxpaper.cli:main"

[tool.setuptools]
packages = ["fxpaper"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
